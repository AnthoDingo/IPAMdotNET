name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-RC[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          for rid in win-x64 linux-x64; do
            out="publish/IPAMdotNet-$GITHUB_REF_NAME-$rid"
            dotnet publish src/IPAMdotNET -c Release -r "$rid" --self-contained -p:Version="$version" -o "$out"
            if [ "$rid" = win-x64 ]; then
              (cd publish && zip -qr "../$(basename "$out").zip" "$(basename "$out")")
            else
              tar -czf "$(basename "$out").tar.gz" -C publish "$(basename "$out")"
            fi
            # Agent de scan distant, mêmes plateformes.
            agent="publish/IPAMdotNet-ScanAgent-$GITHUB_REF_NAME-$rid"
            dotnet publish src/IPAMdotNet.ScanAgent -c Release -r "$rid" --self-contained -p:Version="$version" -p:PublishSingleFile=true -o "$agent"
            if [ "$rid" = win-x64 ]; then
              (cd publish && zip -qr "../$(basename "$agent").zip" "$(basename "$agent")")
            else
              tar -czf "$(basename "$agent").tar.gz" -C publish "$(basename "$agent")"
            fi
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease \
            IPAMdotNet-*.zip IPAMdotNet-*.tar.gz
